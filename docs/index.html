<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日新聞音頻</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2d3150;
    --accent: #6c8fff;
    --accent2: #a78bfa;
    --text: #e2e8f0;
    --muted: #7c85a0;
    --playing: #1e3a5f;
    --playing-border: #6c8fff;
    --radius: 10px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Noto Sans TC', sans-serif;
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
    padding-bottom: 100px;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  header h1 {
    font-size: 18px;
    font-weight: 700;
    color: var(--accent);
    white-space: nowrap;
  }

  #date-select {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 12px;
    border-radius: var(--radius);
    font-size: 14px;
    cursor: pointer;
  }

  #stats {
    margin-left: auto;
    color: var(--muted);
    font-size: 12px;
    white-space: nowrap;
  }

  main {
    max-width: 860px;
    margin: 24px auto;
    padding: 0 16px;
  }

  .category {
    margin-bottom: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .category-header {
    padding: 12px 16px;
    background: var(--surface2);
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
  }

  .category-header h2 {
    font-size: 14px;
    font-weight: 600;
    flex: 1;
  }

  .category-header .count {
    background: var(--border);
    color: var(--muted);
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 20px;
  }

  .category-header .toggle {
    color: var(--muted);
    transition: transform 0.2s;
  }

  .category-header.collapsed .toggle { transform: rotate(-90deg); }

  .items { display: flex; flex-direction: column; }
  .items.hidden { display: none; }

  .item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    transition: background 0.15s;
    cursor: pointer;
  }

  .item:hover { background: var(--surface2); }

  .item.playing {
    background: var(--playing);
    border-left: 3px solid var(--playing-border);
    padding-left: 13px;
  }

  .item-num {
    color: var(--muted);
    font-size: 11px;
    min-width: 28px;
    padding-top: 2px;
    text-align: right;
  }

  .play-btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s, border-color 0.15s;
  }

  .play-btn:hover { border-color: var(--accent); color: var(--accent); }
  .item.playing .play-btn { background: var(--accent); border-color: var(--accent); color: #fff; }

  .item-text {
    flex: 1;
    font-size: 13.5px;
    line-height: 1.65;
    color: var(--text);
  }

  .item.playing .item-text { color: #fff; }

  .tweet-link {
    color: var(--muted);
    font-size: 11px;
    text-decoration: none;
    flex-shrink: 0;
    padding-top: 3px;
    opacity: 0.6;
    transition: opacity 0.15s;
  }

  .tweet-link:hover { opacity: 1; color: var(--accent); }

  /* Bottom player bar */
  #player-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 10px 20px;
    display: none;
    align-items: center;
    gap: 14px;
    z-index: 200;
  }

  #player-bar.active { display: flex; }

  #pb-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  #pb-info {
    flex: 1;
    min-width: 0;
  }

  #pb-title {
    font-size: 12px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #pb-progress-wrap {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    margin-top: 5px;
    cursor: pointer;
    position: relative;
  }

  #pb-progress {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    width: 0%;
    transition: width 0.2s linear;
  }

  #pb-time {
    color: var(--muted);
    font-size: 11px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  #pb-next {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 12px;
    border-radius: var(--radius);
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
  }

  #pb-next:hover { color: var(--text); border-color: var(--accent); }

  #loading {
    text-align: center;
    color: var(--muted);
    padding: 60px 20px;
    font-size: 16px;
  }

  #error {
    text-align: center;
    color: #f87171;
    padding: 60px 20px;
  }
</style>
</head>
<body>

<header>
  <h1>📻 每日新聞</h1>
  <select id="date-select"></select>
  <span id="stats"></span>
</header>

<main id="main">
  <div id="loading">載入中…</div>
</main>

<div id="player-bar">
  <button id="pb-btn">▶</button>
  <div id="pb-info">
    <div id="pb-title"></div>
    <div id="pb-progress-wrap">
      <div id="pb-progress"></div>
    </div>
  </div>
  <span id="pb-time">0:00</span>
  <button id="pb-next">下一條</button>
</div>

<audio id="audio"></audio>

<script>
const audio = document.getElementById('audio');
const playerBar = document.getElementById('player-bar');
const pbBtn = document.getElementById('pb-btn');
const pbTitle = document.getElementById('pb-title');
const pbProgress = document.getElementById('pb-progress');
const pbProgressWrap = document.getElementById('pb-progress-wrap');
const pbTime = document.getElementById('pb-time');
const pbNext = document.getElementById('pb-next');
const dateSelect = document.getElementById('date-select');
const mainEl = document.getElementById('main');
const statsEl = document.getElementById('stats');

let manifest = null;
let currentDate = null;
let flatItems = [];  // [{catIndex, itemIndex, item}] for current date
let currentFlat = -1;

function fmt(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60).toString().padStart(2, '0');
  return `${m}:${sec}`;
}

async function loadManifest() {
  const resp = await fetch('./manifest.json?t=' + Date.now());
  if (!resp.ok) throw new Error('Failed to load manifest');
  return resp.json();
}

function buildFlatItems(dateEntry) {
  const flat = [];
  dateEntry.categories.forEach((cat, ci) => {
    cat.items.forEach((item, ii) => {
      flat.push({ ci, ii, item });
    });
  });
  return flat;
}

function renderDate(dateEntry) {
  mainEl.innerHTML = '';
  flatItems = buildFlatItems(dateEntry);

  let total = 0;
  dateEntry.categories.forEach((cat, ci) => {
    if (!cat.items.length) return;
    total += cat.items.length;

    const section = document.createElement('div');
    section.className = 'category';

    const hdr = document.createElement('div');
    hdr.className = 'category-header';
    hdr.innerHTML = `<h2>${cat.name}</h2><span class="count">${cat.items.length}</span><span class="toggle">▾</span>`;

    const itemsDiv = document.createElement('div');
    itemsDiv.className = 'items';

    cat.items.forEach((item, ii) => {
      const flatIdx = flatItems.findIndex(f => f.ci === ci && f.ii === ii);
      const row = document.createElement('div');
      row.className = 'item';
      row.dataset.flat = flatIdx;

      const tweetHref = item.tweet_id
        ? `https://x.com/i/web/status/${item.tweet_id}`
        : '#';

      row.innerHTML = `
        <span class="item-num">${item.index}</span>
        <button class="play-btn" title="播放">▶</button>
        <span class="item-text">${item.text}</span>
        ${item.tweet_id ? `<a class="tweet-link" href="${tweetHref}" target="_blank" rel="noopener" title="原推文" onclick="event.stopPropagation()">𝕏</a>` : ''}
      `;

      row.addEventListener('click', () => playFlat(flatIdx));
      row.querySelector('.play-btn').addEventListener('click', e => {
        e.stopPropagation();
        playFlat(flatIdx);
      });

      itemsDiv.appendChild(row);
    });

    hdr.addEventListener('click', () => {
      hdr.classList.toggle('collapsed');
      itemsDiv.classList.toggle('hidden');
    });

    section.appendChild(hdr);
    section.appendChild(itemsDiv);
    mainEl.appendChild(section);
  });

  statsEl.textContent = `${dateEntry.date} · 共 ${total} 條`;
}

function playFlat(flatIdx) {
  if (flatIdx < 0 || flatIdx >= flatItems.length) return;

  // Deselect old
  document.querySelectorAll('.item.playing').forEach(el => {
    el.classList.remove('playing');
    el.querySelector('.play-btn').textContent = '▶';
  });

  if (currentFlat === flatIdx && !audio.paused) {
    audio.pause();
    pbBtn.textContent = '▶';
    return;
  }

  currentFlat = flatIdx;
  const { item } = flatItems[flatIdx];

  audio.src = item.file;
  audio.play();

  const row = document.querySelector(`.item[data-flat="${flatIdx}"]`);
  if (row) {
    row.classList.add('playing');
    row.querySelector('.play-btn').textContent = '⏸';
    row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  pbTitle.textContent = `${item.index}. ${item.text}`;
  pbBtn.textContent = '⏸';
  playerBar.classList.add('active');
}

audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  pbProgress.style.width = (audio.currentTime / audio.duration * 100) + '%';
  pbTime.textContent = fmt(audio.currentTime) + ' / ' + fmt(audio.duration);
});

audio.addEventListener('ended', () => {
  if (currentFlat + 1 < flatItems.length) {
    playFlat(currentFlat + 1);
  } else {
    pbBtn.textContent = '▶';
    document.querySelectorAll('.item.playing').forEach(el => {
      el.classList.remove('playing');
      el.querySelector('.play-btn').textContent = '▶';
    });
  }
});

pbBtn.addEventListener('click', () => {
  if (audio.paused) {
    audio.play();
    pbBtn.textContent = '⏸';
    const row = document.querySelector(`.item[data-flat="${currentFlat}"]`);
    if (row) row.querySelector('.play-btn').textContent = '⏸';
  } else {
    audio.pause();
    pbBtn.textContent = '▶';
    const row = document.querySelector(`.item[data-flat="${currentFlat}"]`);
    if (row) row.querySelector('.play-btn').textContent = '▶';
  }
});

pbNext.addEventListener('click', () => {
  if (currentFlat + 1 < flatItems.length) playFlat(currentFlat + 1);
});

pbProgressWrap.addEventListener('click', e => {
  if (!audio.duration) return;
  const rect = pbProgressWrap.getBoundingClientRect();
  audio.currentTime = (e.clientX - rect.left) / rect.width * audio.duration;
});

dateSelect.addEventListener('change', () => {
  currentFlat = -1;
  audio.pause();
  audio.src = '';
  playerBar.classList.remove('active');
  const dateEntry = manifest.dates.find(d => d.date === dateSelect.value);
  if (dateEntry) renderDate(dateEntry);
});

(async () => {
  try {
    manifest = await loadManifest();
    if (!manifest.dates || !manifest.dates.length) {
      mainEl.innerHTML = '<div id="loading">尚無音頻資料，請等待每日更新。</div>';
      return;
    }
    manifest.dates.sort((a, b) => b.date.localeCompare(a.date));
    manifest.dates.forEach(d => {
      const opt = document.createElement('option');
      opt.value = d.date;
      opt.textContent = d.date;
      dateSelect.appendChild(opt);
    });
    renderDate(manifest.dates[0]);
  } catch (e) {
    mainEl.innerHTML = `<div id="error">載入失敗：${e.message}</div>`;
  }
})();
</script>
</body>
</html>
